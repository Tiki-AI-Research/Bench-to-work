# Default Harbor benchmark job configuration (Codex CLI Worker in Docker).
#   scripts/run.sh                  # Run all tasks in `dataset`
#   scripts/run_task.sh <task_id>   # Run a single task

dataset: tasks
task_names: []
exclude_task_names: []

worker:
  harness: codex
  model: gpt-6.2-sol
  effort: high
  base_url: https://api.openai.com/v1
  key_env: OPENAI_API_KEY
  timeout: 3600

roles: configs/roles/pi-openai.json
reward: bench_to_work.rewards:stage_scores

n_attempts: 1
n_concurrent_trials: 2
jobs_dir: jobs
verifier_timeout: 300
reviewer_protocol_retry_limit: 2
